services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fynd}
      POSTGRES_USER: ${POSTGRES_USER:-fynd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fynd_local_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fynd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fynd_postgres_data:
